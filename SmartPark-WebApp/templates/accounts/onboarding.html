{% extends 'base.html' %}
{% load static %}

{% block title %}Onboarding - SmartPark{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-lg-6">
            <h2 class="display-6 fw-bold mb-3 text-body">How will you use SmartPark?</h2>
            <p class="lead text-secondary mb-5">Select your primary role. You can switch between roles at any time.</p>

            <form method="POST" action="{% url 'onboarding' %}">
                {% csrf_token %}
                <div class="row g-4 mb-5">
                    <div class="col-md-6">
                        <label class="w-100 h-100 cursor-pointer">
                            <input type="radio" name="role" value="user" checked class="d-none peer-input">
                            <div class="card p-4 h-100 text-center role-card border" style="background: var(--bg-surface); border-radius: 16px;">
                                <i class="bi bi-car-front fs-1 text-primary mb-3"></i>
                                <h4 class="fw-bold mb-2 text-body">Vehicle Driver</h4>
                                <p class="text-secondary small mb-0">Search nearby spots, book parking slots, and track active sessions.</p>
                            </div>
                        </label>
                    </div>
                    <div class="col-md-6">
                        <label class="w-100 h-100 cursor-pointer">
                            <input type="radio" name="role" value="host" class="d-none peer-input">
                            <div class="card p-4 h-100 text-center role-card border" style="background: var(--bg-surface); border-radius: 16px;">
                                <i class="bi bi-building fs-1 text-success mb-3"></i>
                                <h4 class="fw-bold mb-2 text-body">Parking Host</h4>
                                <p class="text-secondary small mb-0">List your parking facility, configure slot pricing, and earn revenue.</p>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand px-5 py-3 fw-semibold">
                    Continue to Dashboard &rarr;
                </button>
            </form>
        </div>
    </div>
</div>

<style>
    .cursor-pointer { cursor: pointer; }
    .role-card {
        transition: all 0.2s ease;
        border-color: var(--border-default) !important;
    }
    .peer-input:checked + .role-card {
        border-color: var(--brand-aqua) !important;
        box-shadow: 0 0 0 2px var(--brand-aqua);
        background: var(--bg-hover) !important;
    }
</style>
{% endblock %}
